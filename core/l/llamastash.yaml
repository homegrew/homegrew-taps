    branch: main
build_dependencies:
    - pkgconf
    - rust
service:
    run:
        - $HOMEBREW_PREFIX/opt/llamastash/bin/llamastash
        - --llama-server
        - $HOMEBREW_PREFIX/opt/llama.cpp/bin/llama-server
        - daemon
        - start
        - --foreground
    run_type: immediate
