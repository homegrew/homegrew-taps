caveats: |
    GNU "awk" has been installed as "gawk".
    If you need to use it as "awk", you can add a "gnubin" directory
    to your PATH from your ~/.bashrc and/or ~/.zshrc like:

        PATH="$HOMEBREW_PREFIX/opt/gawk/libexec/gnubin:$PATH"
