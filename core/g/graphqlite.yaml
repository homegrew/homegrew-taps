caveats: |
    The SQLite extension is installed in $HOMEBREW_PREFIX/opt/graphqlite/lib/sqlite.
    To load it in the SQLite CLI:
      .load $HOMEBREW_PREFIX/opt/graphqlite/lib/sqlite/graphqlite
