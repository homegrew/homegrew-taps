name: openssh-sk-provider
version: 10.6p2
description: Standalone FIDO2 SecurityKeyProvider (sk-libfido2) for the system OpenSSH
homepage: https://www.openssh.com/
license: SSH-OpenSSH
caveats: |
    To make the system ssh use this provider, add to the `Host *` block in ~/.ssh/config:
      SecurityKeyProvider $HOMEBREW_PREFIX/opt/openssh-sk-provider/lib/sk-libfido2.dylib

    ssh-keygen and ssh-add don't read ~/.ssh/config, so also add to your shell profile:
      export SSH_SK_PROVIDER="$HOMEBREW_PREFIX/opt/openssh-sk-provider/lib/sk-libfido2.dylib"

    The system ssh-agent only allows providers under /usr/lib and /usr/local/lib, so it
    won't hold keys that use this provider. To use an agent, run your own with e.g.:
      ssh-agent -P "$HOMEBREW_CELLAR/openssh-sk-provider/*/lib/*"
