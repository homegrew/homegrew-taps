head:
    url: https://github.com/stackia/rtp2httpd.git
    branch: main
build_dependencies:
    - cmake
service:
    run:
        - $HOMEBREW_PREFIX/opt/rtp2httpd/bin/rtp2httpd
        - --config
        - $HOMEBREW_PREFIX/etc/rtp2httpd.conf
        - --pid-file
        - $HOMEBREW_PREFIX/var/run/rtp2httpd.pid
    run_type: immediate
    log_path: $HOMEBREW_PREFIX/var/log/rtp2httpd.log
    error_log_path: $HOMEBREW_PREFIX/var/log/rtp2httpd.log
    keep_alive: true
