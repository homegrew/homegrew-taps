homepage: https://buildgrid.gitlab.io/recc
license: Apache-2.0
caveats: |
    To launch a compiler with recc, set the following variables:
      CC=$HOMEBREW_PREFIX/opt/recc/bin/recc-cc
      CXX=$HOMEBREW_PREFIX/opt/recc/bin/recc-c++
