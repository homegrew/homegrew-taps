install:
    type: archive
    strip_components: 2
    format: tar.gz
bottle:
    darwin_arm64:
        url: https://ghcr.io/v2/homebrew/core/batt/blobs/sha256:06f367dc07d1a7f0d795f83429e1dc2f7efeb135e1bffc59941cf5c31d5b372c
        sha256: 06f367dc07d1a7f0d795f83429e1dc2f7efeb135e1bffc59941cf5c31d5b372c
        cellar: :any_skip_relocation
    darwin_arm64_15:
        url: https://ghcr.io/v2/homebrew/core/batt/blobs/sha256:0d9844dfd56fd9869400222390b88f6b07e4ec4fc060e0028f2bb63377ec62db
        sha256: 0d9844dfd56fd9869400222390b88f6b07e4ec4fc060e0028f2bb63377ec62db
        cellar: :any_skip_relocation
    darwin_arm64_16:
        url: https://ghcr.io/v2/homebrew/core/batt/blobs/sha256:06f367dc07d1a7f0d795f83429e1dc2f7efeb135e1bffc59941cf5c31d5b372c
        sha256: 06f367dc07d1a7f0d795f83429e1dc2f7efeb135e1bffc59941cf5c31d5b372c
        cellar: :any_skip_relocation
source:
    url: https://github.com/charlie0129/batt.git
head:
    url: https://github.com/charlie0129/batt.git
    branch: master
build_dependencies:
    - go
service:
    run:
        - $HOMEBREW_PREFIX/opt/batt/bin/batt
        - daemon
        - --log-level=debug
        - --always-allow-non-root-access
        - --config=$HOMEBREW_PREFIX/etc/batt.json
    run_type: immediate
    log_path: $HOMEBREW_PREFIX/var/log/batt.log
    error_log_path: $HOMEBREW_PREFIX/var/log/batt.log
    keep_alive: true
