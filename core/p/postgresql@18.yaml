    run_type: immediate
    working_dir: $HOMEBREW_PREFIX
    log_path: $HOMEBREW_PREFIX/var/log/postgresql@18.log
    error_log_path: $HOMEBREW_PREFIX/var/log/postgresql@18.log
    keep_alive: true
