    - pkgconf
service:
    run:
        - $HOMEBREW_PREFIX/opt/php/sbin/php-fpm
        - --nodaemonize
    run_type: immediate
    working_dir: $HOMEBREW_PREFIX/var
    error_log_path: $HOMEBREW_PREFIX/var/log/php-fpm.log
    keep_alive: true
