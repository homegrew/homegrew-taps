        - $HOMEBREW_PREFIX/var/postgresql@17
    run_type: immediate
    working_dir: $HOMEBREW_PREFIX
    log_path: $HOMEBREW_PREFIX/var/log/postgresql@17.log
    error_log_path: $HOMEBREW_PREFIX/var/log/postgresql@17.log
    keep_alive: true
