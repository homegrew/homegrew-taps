        - $HOMEBREW_PREFIX/opt/caddy/bin/caddy
        - run
        - --config
        - $HOMEBREW_PREFIX/etc/Caddyfile
    run_type: immediate
    log_path: $HOMEBREW_PREFIX/var/log/caddy.log
    error_log_path: $HOMEBREW_PREFIX/var/log/caddy.log
    keep_alive: true
