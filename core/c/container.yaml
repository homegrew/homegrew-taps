head:
    url: https://github.com/apple/container.git
    branch: main
service:
    run:
        - $HOMEBREW_PREFIX/opt/container/bin/container
        - system
        - start
        - --disable-kernel-install
    run_type: immediate
    working_dir: $HOMEBREW_PREFIX/var
    log_path: $HOMEBREW_PREFIX/var/log/container.log
    error_log_path: $HOMEBREW_PREFIX/var/log/container.log
