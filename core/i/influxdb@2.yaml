source:
    url: https://github.com/influxdata/influxdb.git
build_dependencies:
    - breezy
    - go
    - pkgconf
    - protobuf
    - rust
service:
    run:
        - $HOMEBREW_PREFIX/opt/influxdb@2/bin/influxd
    run_type: immediate
    working_dir: $HOMEBREW_PREFIX
    log_path: $HOMEBREW_PREFIX/var/log/influxdb2/influxd_output.log
    error_log_path: $HOMEBREW_PREFIX/var/log/influxdb2/influxd_output.log
    keep_alive: true
