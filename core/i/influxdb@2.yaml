name: influxdb@2
version: 2.10.0
description: Time series, events, and metrics database
homepage: https://influxdata.com/time-series-platform/influxdb/
license: MIT
caveats: |
    This formula does not contain command-line interface; to install it, run:
      brew install influxdb-cli
url:
    darwin_amd64: https://github.com/influxdata/influxdb.git
    darwin_amd64_10: https://github.com/influxdata/influxdb.git
