    branch: master
build_dependencies:
    - go
service:
    run:
        - $HOMEBREW_PREFIX/opt/telegraf/bin/telegraf
        - -config
        - $HOMEBREW_PREFIX/etc/telegraf.conf
        - -config-directory
        - $HOMEBREW_PREFIX/etc/telegraf.d
    run_type: immediate
    working_dir: $HOMEBREW_PREFIX/var
    log_path: $HOMEBREW_PREFIX/var/log/telegraf.log
    error_log_path: $HOMEBREW_PREFIX/var/log/telegraf.log
    keep_alive: true
